[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "google-antigravity"
version = "0.2.0"
description = "Google Antigravity Python SDK for Autonomous AI Agents, Multi-Agent Claude Bridges, and Scientific Research"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Google LLC"},
    {name = "Gia Bao Huynh (Jun)", email = "huynhbao@asu.edu"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "absl-py",
    "google-genai>=1.0",
    "mcp>=1.0,<3.0",
    "pydantic>=2.0",
    "uvicorn>=0.46",
    "websockets>=12.0",
    "protobuf>=7.35",
    "duckdb>=1.0.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "grpcio-tools>=1.60.0",
]
otel = [
    "opentelemetry-api",
    "opentelemetry-sdk",
]

[project.urls]
Homepage = "https://github.com/giabaohuynhasu/antigravity-sdk-python"
Repository = "https://github.com/giabaohuynhasu/antigravity-sdk-python"
Documentation = "https://giabaohuynhasu.github.io/research-landing/"

[tool.setuptools.packages.find]
where = ["."]
include = ["google*"]
